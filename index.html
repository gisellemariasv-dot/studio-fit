    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Fit | Aula Experimental</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
            color: #111;
        }

        .subtitle {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #555;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .benefits {
            margin: 25px 0;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>Studio Fit</h1>

            <p class="subtitle">
                Faça sua primeira aula experimental gratuitamente
                e conheça nosso espaço.
            </p>

            <div class="benefits">
                ✅ Aula experimental gratuita<br>
                ✅ Professores especializados<br>
                ✅ Ambiente completo
            </div>

            <h2>Agende sua aula</h2>

            <form id="leadForm">

                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="whatsapp">WhatsApp</label>
                <input
                    type="tel"
                    id="whatsapp"
                    name="whatsapp"
                    placeholder="(11) 99999-9999"
                    required
                >

                <button type="submit">
                    QUERO MINHA AULA GRÁTIS
                </button>

            </form>

        </div>
    </div>

    <script>
        document.getElementById("leadForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Cadastro enviado com sucesso!");

        });
    </script>

</body>
</html>
